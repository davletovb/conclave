name: Apply reasoning UI review fixes
on:
  push:
    branches: [feat/reasoning-first-ui]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          surface = Path('apps/web/src/reasoning-surface.tsx')
          s = surface.read_text()

          anchor = '''function modeUsesSynthesizer(mode: OrchestrationMode) {
  return ["panel", "debate", "consensus", "judge", "research-council", "planner-executor", "custom"].includes(mode);
}
'''
          addition = anchor + '''
function defaultFinalizer(mode: OrchestrationMode, participants: ModelRef[]) {
  if (participants.length === 0) return undefined;
  return mode === "planner-executor" ? participants.at(-1) : participants[0];
}
'''
          if anchor not in s:
              raise SystemExit('modeUsesSynthesizer anchor not found')
          s = s.replace(anchor, addition, 1)

          s = s.replace(
              '  const selectedSynthesizer = participants.find(model => modelKey(model) === synthesizerKey);\n',
              '  const selectedSynthesizer = participants.find(model => modelKey(model) === synthesizerKey);\n  const defaultSynthesizer = defaultFinalizer(mode, participants);\n',
              1,
          )
          old = '<option value="">First selected · default</option>'
          new = '<option value="">{defaultSynthesizer ? `Default · ${defaultSynthesizer.label}` : "Default"}</option>'
          if old not in s:
              raise SystemExit('default option anchor not found')
          s = s.replace(old, new, 1)

          s = s.replace(
              '  inspection,\n  onInspect,\n}: {\n  steps: OrchestrationStep[];\n  loading: boolean;\n  inspection: RunInspection | null;\n  onInspect: () => void;\n}) {',
              '  inspection,\n  completedStepIds,\n  onInspect,\n}: {\n  steps: OrchestrationStep[];\n  loading: boolean;\n  inspection: RunInspection | null;\n  completedStepIds: string[];\n  onInspect: () => void;\n}) {',
              1,
          )
          old = '          const status = stepMeta?.status ?? (loading && !step.content ? "working" : loading ? "streaming" : "completed");'
          new = '          const status = stepMeta?.status ?? (completedStepIds.includes(step.id) ? "completed" : loading ? (step.content ? "streaming" : "working") : (step.content ? "partial" : "pending"));'
          if old not in s:
              raise SystemExit('status derivation anchor not found')
          s = s.replace(old, new, 1)

          old = '  const synth = synthesizer ?? participants[0];'
          new = '  const synth = synthesizer ?? defaultFinalizer(mode, participants);'
          if old not in s:
              raise SystemExit('summary finalizer anchor not found')
          s = s.replace(old, new, 1)
          surface.write_text(s)

          main = Path('apps/web/src/main.tsx')
          m = main.read_text()
          old = '  const [liveSteps, setLiveSteps] = useState<OrchestrationStep[]>([]);\n'
          new = old + '  const [completedStepIds, setCompletedStepIds] = useState<string[]>([]);\n'
          if old not in m:
              raise SystemExit('liveSteps state anchor not found')
          m = m.replace(old, new, 1)

          m = re.sub(
              r'(?m)^(\s*)setLiveSteps\(\[\]\);$',
              lambda match: f'{match.group(1)}setLiveSteps([]);\n{match.group(1)}setCompletedStepIds([]);',
              m,
          )
          m = re.sub(
              r'(?m)^(\s*)setLiveSteps\(run\.result\.steps\);$',
              lambda match: f'{match.group(1)}setLiveSteps(run.result.steps);\n{match.group(1)}setCompletedStepIds(run.result.steps.map(step => step.id));',
              m,
          )
          m = re.sub(
              r'(?m)^(\s*)setLiveSteps\(streamEvent\.result\.steps\);$',
              lambda match: f'{match.group(1)}setLiveSteps(streamEvent.result.steps);\n{match.group(1)}setCompletedStepIds(streamEvent.result.steps.map(step => step.id));',
              m,
          )

          started = '''    if (streamEvent.type === "step_started") {
      setLiveSteps(current => current.some(step => step.id === streamEvent.stepId)
'''
          if started not in m:
              raise SystemExit('step_started anchor not found')
          m = m.replace(started, '''    if (streamEvent.type === "step_started") {
      setCompletedStepIds(current => current.filter(id => id !== streamEvent.stepId));
      setLiveSteps(current => current.some(step => step.id === streamEvent.stepId)
''', 1)

          completed = '''    if (streamEvent.type === "step_completed") {
      setLiveSteps(current => current.some(step => step.id === streamEvent.step.id)
        ? current.map(step => step.id === streamEvent.step.id ? streamEvent.step : step)
        : [...current, streamEvent.step]);
      return;
    }
'''
          if completed not in m:
              raise SystemExit('step_completed anchor not found')
          m = m.replace(completed, '''    if (streamEvent.type === "step_completed") {
      setLiveSteps(current => current.some(step => step.id === streamEvent.step.id)
        ? current.map(step => step.id === streamEvent.step.id ? streamEvent.step : step)
        : [...current, streamEvent.step]);
      setCompletedStepIds(current => current.includes(streamEvent.step.id) ? current : [...current, streamEvent.step.id]);
      return;
    }
''', 1)

          council = '''              <CouncilWork
                steps={displayedSteps}
                loading={loading}
                inspection={inspection}
                onInspect={toggleInspector}
              />'''
          if council not in m:
              raise SystemExit('CouncilWork anchor not found')
          m = m.replace(council, '''              <CouncilWork
                steps={displayedSteps}
                loading={loading}
                inspection={inspection}
                completedStepIds={completedStepIds}
                onInspect={toggleInspector}
              />''', 1)

          main.write_text(m)
          PY
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit verified review fixes
        run: |
          rm .github/workflows/fix-reasoning-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/reasoning-surface.tsx .github/workflows/fix-reasoning-review.yml
          git commit -m "fix: align finalizer and live step status"
          git push origin HEAD:feat/reasoning-first-ui
