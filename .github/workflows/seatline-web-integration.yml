name: Native Seatline web integration
on:
  pull_request:
permissions:
  contents: read
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: davletovb/seatline
          ref: 1bab40697bb3f9cba6431fe3c490a85e36981250
          path: seatline-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --manifest-path seatline-runtime/Cargo.toml --locked -p seatline-companion
      - run: node scripts/seatline-web-roundtrip.mjs seatline-runtime/target/debug/seatline-companion
