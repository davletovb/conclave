name: Native Seatline web integration
on:
  pull_request:
permissions:
  contents: read
jobs:
  roundtrip:
    # `current` is the Seatline revision Conclave is tested against, whose readiness API the app uses. `minimum` is the oldest companion it
    # still works with: it predates that API, refuses the readiness methods, and the app falls back to status and send.
    name: roundtrip (${{ matrix.companion }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - companion: current
            ref: 0cb105e4c4d753abf8fb305d8ccedeeb64dd0ef4
            arguments: ""
          - companion: minimum
            ref: dc1086582c8b98498aa48dae91c8d174bc3cfc3c
            arguments: "--legacy"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: davletovb/seatline
          ref: ${{ matrix.ref }}
          path: seatline-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --manifest-path seatline-runtime/Cargo.toml --locked -p seatline-companion
      - run: node scripts/seatline-web-roundtrip.mjs seatline-runtime/target/debug/seatline-companion ${{ matrix.arguments }}
