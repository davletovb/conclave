name: Native Seatline web integration
on:
  pull_request:
permissions:
  contents: read
jobs:
  roundtrip:
    # Current provides the launch-policy gate. Legacy still answers status but
    # must refuse protected generation without launching a prompt.
    name: roundtrip (${{ matrix.companion }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - companion: current
            ref: bf07713da8fa767e45b2480bebc36244dcf71c37
            arguments: ""
          - companion: legacy
            ref: dc1086582c8b98498aa48dae91c8d174bc3cfc3c
            arguments: "--legacy"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: davletovb/seatline
          ref: ${{ matrix.ref }}
          path: seatline-runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --manifest-path seatline-runtime/Cargo.toml --locked -p seatline-companion
      - run: node scripts/seatline-web-roundtrip.mjs seatline-runtime/target/debug/seatline-companion ${{ matrix.arguments }}
      # Linked browsers and the background web service, which only the current companion has.
      - if: matrix.companion == 'current'
        run: node scripts/seatline-web-connect.mjs seatline-runtime/target/debug/seatline-companion
