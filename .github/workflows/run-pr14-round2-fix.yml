name: Run PR14 round2 fix
on:
  push:
    branches: [feat/partial-failure-recovery]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/partial-failure-recovery
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          python scripts/pr14_round2_fix.py
          python scripts/pr14_round2_testfix.py
      - name: Format changed files
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          pnpm dlx prettier@3.6.2 --write \
            apps/server/src/orchestrator.ts \
            apps/server/src/orchestrator.test.ts \
            apps/server/src/state/run-inspection.ts \
            apps/server/src/state/run-inspection.test.ts \
            apps/web/src/main.tsx
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit fixes
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/server/src/orchestrator.ts \
            apps/server/src/orchestrator.test.ts \
            apps/server/src/state/run-inspection.ts \
            apps/server/src/state/run-inspection.test.ts \
            apps/web/src/main.tsx
          git commit -m "fix: reclaim debate budget and retry inspection state"
          git push origin HEAD:feat/partial-failure-recovery
