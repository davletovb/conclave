name: Apply recovery implementation
on:
  push:
    branches: [feat/partial-failure-recovery]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/partial-failure-recovery
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply recovery changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing target: {label}')
              return text.replace(old, new, 1)

          def between(text, start, end, new, label):
              i = text.find(start)
              if i < 0: raise SystemExit(f'missing start: {label}')
              j = text.find(end, i)
              if j < 0: raise SystemExit(f'missing end: {label}')
              return text[:i] + new + text[j:]

          # Shared contracts
          p = Path('packages/core/src/index.ts')
          s = p.read_text()
          s = once(s, '''export interface RateLimitNotice {
  provider: ProviderId;
  model: string;
  stepId: string;
  message: string;
  at: string;
}
