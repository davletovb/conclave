name: Apply Research Council Cardinality Fix
on:
  push:
    branches: [fix/research-council-cardinality]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix web planned call count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/main.tsx')
          s = p.read_text()
          old = '    case "research-council": return Math.max(4, participantCount) + 1;'
          new = '    case "research-council": return participantCount + 1;'
          if old not in s:
              raise SystemExit('research council planned-call line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit verified fix
        run: |
          rm .github/workflows/apply-research-council-cardinality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx .github/workflows/apply-research-council-cardinality.yml
          git commit -m "fix: align research council membership"
          git push origin HEAD:fix/research-council-cardinality
