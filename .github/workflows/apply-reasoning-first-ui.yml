name: Apply reasoning-first UI transform
on:
  push:
    branches: [feat/reasoning-first-ui]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'chore apply reasoning-first UI transform' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire reasoning-first surface
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/main.tsx')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing anchor: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              'import { Markdown } from "./markdown";\nimport "./styles.css";',
              'import { Markdown } from "./markdown";\nimport { CouncilWork, RunConfigSummary, RunSetup } from "./reasoning-surface";\nimport "./styles.css";',
              'reasoning surface import',
          )

          replace_once(
              '  const [mode, setMode] = useState<OrchestrationMode>("panel");\n  const [theme, setTheme] = useState<Theme>(initialTheme);',
              '  const [mode, setMode] = useState<OrchestrationMode>("panel");\n  const [setupOpen, setSetupOpen] = useState(true);\n  const [theme, setTheme] = useState<Theme>(initialTheme);',
              'setup state',
          )

          replace_once(
              '''  const participants = useMemo(\n    () => models.filter(model => selected.includes(modelKey(model))),\n    [models, selected],\n  );''',
              '''  const participants = useMemo(\n    () => selected\n      .map(key => models.find(model => modelKey(model) === key))\n      .filter((model): model is ModelRef => Boolean(model)),\n    [models, selected],\n  );''',
              'participant ordering',
          )

          replace_once(
              '    setConversation(data);\n    localStorage.setItem("conclave.conversationId", id);',
              '    setConversation(data);\n    setSetupOpen(false);\n    localStorage.setItem("conclave.conversationId", id);',
              'conversation closes setup',
          )
          replace_once(
              '      setConversation(thread);\n\n      if (run.status === "completed" && run.result) {',
              '      setConversation(thread);\n      setSetupOpen(false);\n\n      if (run.status === "completed" && run.result) {',
              'recovery closes setup',
          )
          replace_once(
              '    setConversation(null);\n    setActiveRunId(null);',
              '    setConversation(null);\n    setSetupOpen(true);\n    setActiveRunId(null);',
              'new conversation opens setup',
          )
          replace_once(
              '      if (!isCurrent(epoch)) return;\n\n      setActiveRunId(started.runId);',
              '      if (!isCurrent(epoch)) return;\n\n      setSetupOpen(false);\n      setActiveRunId(started.runId);',
              'submitted run closes setup',
          )

          nav_start = s.index('        <nav className="mode-list" aria-label="Orchestration mode">')
          nav_end = s.index('        </nav>\n', nav_start) + len('        </nav>\n')
          s = s[:nav_start] + s[nav_end:]

          header_start = s.index('        <header className="topbar">')
          header_end = s.index('        </header>\n', header_start) + len('        </header>\n')
          s = s[:header_start] + s[header_end:]

          replace_once(
              '        <div className="status" title={runtimeTitle}><span className="dot" /> {runtimeLabel}</div>',
              '''        <div className="sidebar-footer">\n          <button\n            className="theme-toggle"\n            type="button"\n            aria-label={`Switch to ${theme === "dark" ? "light" : "dark"} theme`}\n            title={`Switch to ${theme === "dark" ? "light" : "dark"} theme`}\n            onClick={() => setTheme(current => current === "dark" ? "light" : "dark")}\n          >\n            {theme === "dark" ? "☀" : "☾"}\n          </button>\n          <div className="status" title={runtimeTitle}><span className="dot" /> {runtimeLabel}</div>\n        </div>''',
              'sidebar footer',
          )

          setup = '''        <div className="content">\n          {setupOpen && (\n            <RunSetup\n              mode={mode}\n              modes={modes}\n              onModeChange={selectMode}\n              models={models}\n              selectedKeys={selected}\n              participants={participants}\n              onToggleModel={toggleModel}\n              synthesizerKey={synthesizerKey}\n              onSynthesizerChange={setSynthesizerKey}\n              maxCalls={maxCalls}\n              onMaxCallsChange={setMaxCalls}\n              maxRounds={maxRounds}\n              onMaxRoundsChange={setMaxRounds}\n              expectedCalls={expectedCalls}\n              loading={loading}\n            />\n          )}\n'''
          replace_once('        <div className="content">\n', setup, 'setup surface insertion')
          replace_once('{mode === "custom" && (', '{setupOpen && mode === "custom" && (', 'custom setup visibility')

          synth_anchor = '''                <label className="workflow-preset-picker">\n                  <span>Synthesizer</span>\n                  <select\n                    value={selectedSynthesizer ? synthesizerKey : ""}\n                    disabled={loading || participants.length === 0}\n                    onChange={event => setSynthesizerKey(event.target.value)}\n                  >\n                    <option value="">First selected · default</option>\n                    {participants.map(model => <option key={modelKey(model)} value={modelKey(model)}>{model.label}</option>)}\n                  </select>\n                </label>\n'''
          if synth_anchor in s:
              s = s.replace(synth_anchor, '', 1)

          replace_once(
              '!result && !loading && displayedSteps.length === 0 && priorMessages.length === 0 && mode !== "custom"',
              '!result && !loading && displayedSteps.length === 0 && priorMessages.length === 0 && mode !== "custom" && !setupOpen',
              'hero setup guard',
          )

          inspector_bar_start = s.find('          {activeRunId && (\n            <div className="inspector-bar">')
          if inspector_bar_start != -1:
              inspector_next = s.index('          {inspectorOpen && (', inspector_bar_start)
              s = s[:inspector_bar_start] + s[inspector_next:]

          replace_once(
              '''                {inspection && <span className={`run-state state-${inspection.run.status}`}>{inspection.run.status}</span>}\n              </div>''',
              '''                <div className="inspector-head-actions">\n                  {inspection && <span className={`run-state state-${inspection.run.status}`}>{inspection.run.status}</span>}\n                  <button type="button" className="drawer-close" aria-label="Close run details" onClick={() => setInspectorOpen(false)}>×</button>\n                </div>\n              </div>''',
              'drawer close control',
          )

          step_start = s.index('              <div className="step-grid">')
          step_end = s.index('            </section>\n          )}\n        </div>\n\n        <form className="composer"', step_start)
          s = s[:step_start] + '''              <CouncilWork\n                steps={displayedSteps}\n                loading={loading}\n                inspection={inspection}\n                onInspect={toggleInspector}\n              />\n''' + s[step_end:]

          controls_start = s.index('          <div className="run-controls">')
          controls_end = s.index('          <textarea\n            ref={promptRef}', controls_start)
          s = s[:controls_start] + '''          <RunConfigSummary\n            mode={mode}\n            modes={modes}\n            participants={participants}\n            synthesizer={selectedSynthesizer}\n            onConfigure={() => setSetupOpen(current => !current)}\n            onInspect={toggleInspector}\n            canInspect={Boolean(activeRunId)}\n          />\n''' + s[controls_end:]

          path.write_text(s)

          css = Path('apps/web/src/styles.css')
          styles = css.read_text()
          marker = '/* reasoning-first workspace */'
          if marker in styles:
              raise SystemExit('reasoning-first CSS already present')
          styles += r'''\n\n/* reasoning-first workspace */\n.shell { grid-template-columns: 248px minmax(0, 1fr); }\n.sidebar { padding: 24px 18px; gap: 18px; }\n.sidebar-footer { margin-top: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }\n.sidebar-footer .status { margin-top: 0; min-width: 0; flex: 1; }\n.sidebar-footer .theme-toggle { width: 32px; height: 32px; flex: 0 0 auto; }\n.workspace { position: relative; }\n.topbar { display: none; }\n.content { width: min(920px, 100%); padding: 46px 34px 210px; }\n\n.setup-surface { display: grid; gap: 34px; margin-bottom: 34px; }\n.setup-intro { max-width: 720px; }\n.setup-intro h2 { margin: 10px 0 10px; font: 500 clamp(30px, 4vw, 48px)/1.08 Georgia, serif; letter-spacing: -.035em; }\n.setup-intro p { margin: 0; color: var(--muted); max-width: 650px; line-height: 1.6; }\n.intent-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }\n.intent-group { border: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 72%, transparent); border-radius: 16px; padding: 15px; display: grid; gap: 12px; }\n.intent-copy { display: grid; gap: 3px; }\n.intent-copy strong { font-size: 13px; }\n.intent-copy span { color: var(--muted); font-size: 11px; line-height: 1.45; }\n.intent-options { display: grid; gap: 7px; }\n.intent-mode { width: 100%; border: 1px solid var(--border); background: var(--surface-soft); border-radius: 11px; padding: 10px 11px; text-align: left; cursor: pointer; }\n.intent-mode:hover { background: var(--surface-hover); }\n.intent-mode.selected { border-color: var(--border-strong); background: var(--surface-active); box-shadow: inset 3px 0 0 var(--link); }\n.intent-mode strong, .intent-mode span { display: block; }\n.intent-mode strong { font-size: 12px; }\n.intent-mode span { margin-top: 2px; color: var(--muted); font-size: 10px; }\n.advanced-workflows { grid-column: 1 / -1; border: 1px dashed var(--border); border-radius: 13px; padding: 10px 12px; }\n.advanced-workflows > summary, .advanced-run-settings > summary { cursor: pointer; color: var(--muted); font-size: 11px; }\n.intent-options.advanced { margin-top: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }\n\n.setup-models { border-top: 1px solid var(--border-soft); padding-top: 24px; display: grid; gap: 16px; }\n.setup-section-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }\n.setup-section-heading h3 { margin: 4px 0 0; font-size: 20px; }\n.setup-call-estimate { color: var(--muted); font-size: 11px; }\n.setup-model-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }\n.setup-model { min-width: 0; border: 1px solid var(--border); background: var(--surface-soft); border-radius: 12px; padding: 10px 11px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }\n.setup-model:hover { background: var(--surface-hover); }\n.setup-model.selected { border-color: var(--border-strong); background: var(--surface-active); }\n.selection-state { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }\n.model-identity { min-width: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; }\n.model-identity > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.model-identity.compact { font-size: 11px; }\n.provider-mark { width: 22px; height: 22px; border: 1px solid var(--border-control); background: var(--surface-solid); border-radius: 7px; display: inline-grid; place-items: center; flex: 0 0 auto; color: var(--text); font-size: 11px; font-weight: 700; line-height: 1; }\n.provider-openai { border-radius: 50%; }\n.provider-anthropic { font-family: Georgia, serif; }\n.provider-xai { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: lowercase; }\n.role-roster { display: grid; border: 1px solid var(--border); border-radius: 13px; overflow: hidden; }\n.role-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 9px 11px; border-bottom: 1px solid var(--border-soft); }\n.role-row:last-child { border-bottom: 0; }\n.role-index { color: var(--muted-3); font: 10px ui-monospace, monospace; }\n.role-name { color: var(--muted); font-size: 10px; }\n.synthesizer-control { border: 1px solid var(--border); background: var(--surface); border-radius: 13px; padding: 12px 13px; display: flex; justify-content: space-between; gap: 18px; align-items: center; }\n.synthesizer-control > span { display: grid; gap: 3px; }\n.synthesizer-control strong { font-size: 12px; }\n.synthesizer-control small { color: var(--muted); font-size: 10px; }\n.synthesizer-control select, .advanced-run-fields select, .advanced-run-fields input { border: 1px solid var(--border-control); background: var(--surface-input); color: var(--text); border-radius: 9px; padding: 8px 9px; }\n.advanced-run-settings { border-top: 1px solid var(--border-soft); padding-top: 12px; }\n.advanced-run-fields { display: flex; gap: 12px; margin-top: 10px; }\n.advanced-run-fields label { display: grid; gap: 4px; color: var(--muted); font-size: 10px; }\n\n.final-card { border: 0; background: transparent; padding: 4px 0 18px; border-radius: 0; }\n.final-card .markdown { margin-top: 14px; font-size: 17px; line-height: 1.72; color: var(--text); }\n.results { gap: 22px; }\n.run-telemetry { order: 3; opacity: .75; }\n.council-work { border-top: 1px solid var(--border-soft); margin-top: 4px; }\n.council-work-heading { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }\n.council-work-heading > div { display: flex; align-items: center; gap: 10px; }\n.council-count { color: var(--muted); font-size: 10px; }\n.text-button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px 0; font-size: 10px; }\n.text-button:hover { color: var(--text); }\n.member-lines { border-bottom: 1px solid var(--border-soft); }\n.member-line { border-top: 1px solid var(--border-soft); }\n.member-line > summary { min-height: 46px; list-style: none; display: grid; grid-template-columns: 16px minmax(150px, 1fr) minmax(90px, auto) auto auto auto; gap: 10px; align-items: center; cursor: pointer; color: var(--text-card); }\n.member-line > summary::-webkit-details-marker { display: none; }\n.member-chevron { color: var(--muted-3); font-size: 20px; transition: transform .15s ease; transform-origin: center; }\n.member-line[open] .member-chevron { transform: rotate(90deg); }\n.member-role, .member-status, .member-stat { color: var(--muted); font-size: 10px; }\n.member-status { text-transform: uppercase; letter-spacing: .06em; }\n.member-response { padding: 0 20px 18px 46px; color: var(--text-card); font-size: 13px; }\n.member-response .markdown { line-height: 1.65; }\n.member-lineage { color: var(--muted-3); font-size: 10px; margin-bottom: 10px; }\n\n.run-inspector { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); overflow-y: auto; border: 0; border-left: 1px solid var(--border); border-radius: 0; background: var(--surface-solid); box-shadow: -22px 0 60px var(--shadow); padding: 24px; }\n.run-inspector-head { position: sticky; top: -24px; z-index: 2; background: var(--surface-solid); padding: 20px 0 14px; }\n.inspector-head-actions { display: flex; align-items: center; gap: 10px; }\n.drawer-close { width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-soft); color: var(--text); cursor: pointer; font-size: 18px; line-height: 1; }\n.inspector-bar { display: none; }\n\n.run-config-summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }\n.config-pill { min-width: 0; border: 0; background: transparent; padding: 2px 0; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; color: var(--text); }\n.config-pill strong { font-size: 11px; }\n.config-pill span { color: var(--muted); font-size: 10px; }\n.config-caret { font-size: 13px !important; }\n.composer { left: calc(248px + (100vw - 248px - min(920px, calc(100vw - 248px))) / 2 + 34px); right: max(34px, calc((100vw - 248px - 920px) / 2 + 34px)); }\n\n@media (max-width: 980px) {\n  .intent-grid { grid-template-columns: 1fr; }\n  .advanced-workflows { grid-column: auto; }\n  .intent-options.advanced { grid-template-columns: 1fr; }\n  .member-line > summary { grid-template-columns: 16px minmax(130px, 1fr) auto auto; }\n  .member-stat { display: none; }\n}\n\n@media (max-width: 760px) {\n  .shell { display: block; }\n  .sidebar { min-height: auto; border-right: 0; border-bottom: 1px solid var(--border-soft); padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }\n  .sidebar > div:first-child { display: flex; align-items: center; gap: 9px; }\n  .sidebar > div:first-child h1 { margin: 0; font-size: 19px; }\n  .sidebar > div:first-child .muted, .conversation-list, .quota { display: none; }\n  .brand-mark { width: 32px; height: 32px; border-radius: 10px; font-size: 18px; }\n  .new-chat { width: auto; }\n  .sidebar-footer { grid-column: 1 / -1; margin-top: 4px; }\n  .content { padding: 30px 18px 205px; }\n  .setup-intro h2 { font-size: 34px; }\n  .setup-model-grid { grid-template-columns: 1fr; }\n  .synthesizer-control { align-items: stretch; flex-direction: column; }\n  .member-line > summary { grid-template-columns: 16px minmax(0, 1fr) auto; }\n  .member-role { display: none; }\n  .member-response { padding-left: 28px; }\n  .composer { left: 14px; right: 14px; bottom: 14px; }\n  .run-inspector { width: 100vw; }\n}\n'''
          css.write_text(styles)
          PY
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit verified UI redesign
        run: |
          rm .github/workflows/apply-reasoning-first-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/styles.css .github/workflows/apply-reasoning-first-ui.yml
          git commit -m "feat: simplify reasoning workspace hierarchy"
          git push origin HEAD:feat/reasoning-first-ui
