name: Tune recovery UI
on:
  push:
    branches: [feat/partial-failure-recovery]
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/partial-failure-recovery
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final recovery polish
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          python <<'PY'
          from pathlib import Path

          p = Path('apps/web/src/reasoning-surface.tsx')
          s = p.read_text()
          old = '''  const participantKeys = new Set(participants.map(modelKey));
  const independent = allModels.find(model => !participantKeys.has(modelKey(model)));
  if (independent) return independent;
'''
          new = '''  const participantKeys = new Set(participants.map(modelKey));
  const independent = allModels.find(model => model.source !== "mock" && !participantKeys.has(modelKey(model)))
    ?? allModels.find(model => !participantKeys.has(modelKey(model)));
  if (independent) return independent;
'''
          if old not in s: raise SystemExit('default finalizer target missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('apps/web/src/main.tsx')
          s = p.read_text()
          target = '''    if (streamEvent.type === "text_delta") {
      setLiveSteps(current => current.map(step => step.id === streamEvent.stepId
        ? { ...step, content: step.content + streamEvent.delta }
        : step));
      return;
    }
'''
          replacement = '''    if (streamEvent.type === "step_retrying") {
      setCompletedStepIds(current => current.filter(id => id !== streamEvent.stepId));
      setLiveSteps(current => current.map(step => step.id === streamEvent.stepId
        ? { ...step, content: "" }
        : step));
      return;
    }

    if (streamEvent.type === "text_delta") {
      setLiveSteps(current => current.map(step => step.id === streamEvent.stepId
        ? { ...step, content: step.content + streamEvent.delta }
        : step));
      return;
    }
'''
          if target not in s: raise SystemExit('stream retry target missing')
          s = s.replace(target, replacement, 1)

          status = '''                          <span>{step.status}</span>
                          <span>{elapsedLabel(step.durationMs)}</span>
'''
          status_new = '''                          <span>{step.status}</span>
                          {step.attempts && step.attempts > 1 && <span>{step.attempts} attempts</span>}
                          <span>{elapsedLabel(step.durationMs)}</span>
'''
          if status in s: s = s.replace(status, status_new, 1)

          lineage = '''                        {step.dependsOn.length > 0 && <small>after → {step.dependsOn.join(" · ")}</small>}
'''
          lineage_new = '''                        {step.error && <small className="inspection-step-error">{step.error}</small>}
                        {step.dependsOn.length > 0 && <small>after → {step.dependsOn.join(" · ")}</small>}
'''
          if lineage in s: s = s.replace(lineage, lineage_new, 1)
          p.write_text(s)
          PY
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit verified polish
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/reasoning-surface.tsx
          git commit -m "fix: reset streamed output when retrying a step" || exit 0
          git push origin HEAD:feat/partial-failure-recovery